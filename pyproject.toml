[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvulnscanner"
version = "2.0.0"
description = "Auditor pasivo de seguridad web: reconocimiento, TLS, headers, DNS, subdominios y correlación de CVEs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "fozzy3" }]
license = { text = "MIT" }
dependencies = [
    "dnspython>=2.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]
# Motores externos (opcionales): si están instalados, se activan solos.
enhanced = [
    "sslyze>=6.0",            # análisis TLS profundo
    "python-Wappalyzer>=0.3", # fingerprint de tecnologías + versiones
    "setuptools",             # pkg_resources para Wappalyzer en Py>=3.12
    "PyJWT>=2.8",             # decodificación robusta de JWT
    "detect-secrets>=1.5",    # secretos por entropía
    "nvdlib>=0.7",            # correlación CVE multi-componente
]
apifuzz = ["schemathesis>=3"] # fuzzing de API contra su OpenAPI
# Laboratorio de red (capa 3/4): canal encubierto en IP ID (académico).
netlab = ["scapy>=2.5", "scikit-learn>=1.3", "numpy>=1.24"]  # + netfilterqueue (necesita libnetfilter-queue-dev)

[project.scripts]
webvulnscanner = "webvulnscanner.cli:main"
webvulnscanner-covert = "webvulnscanner.covert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webvulnscanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
packages = ["webvulnscanner"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
