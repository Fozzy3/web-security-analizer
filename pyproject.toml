[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvulnscanner"
version = "2.0.0"
description = "Auditor pasivo de seguridad web: reconocimiento, TLS, headers, DNS, subdominios y correlación de CVEs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "fozzy3" }]
license = { text = "MIT" }
dependencies = [
    "dnspython>=2.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
webvulnscanner = "webvulnscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webvulnscanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
packages = ["webvulnscanner"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
